name: trc20-lab
description: |
  Stand up a private chain, deploy a TRC20 from source, drive load through
  it with txgen, and verify the balances moved by exactly the amount sent.

  Every step that leaves trond is `kind: host` and therefore needs
  --allow-host-exec. The chain's TVM upgrade flags live in network.yaml,
  not here: contracts deploy without them and then never execute, and the
  calls come back empty rather than reverting.
params:
  - name: lab_dir
    required: true
    description: directory holding network.yaml, contract/ and verify.js
  - name: node_url
    default: http://127.0.0.1:8390
  - name: sender_key
    required: true
  - name: owner_hex
    default: "41928c9af0651632157ef27a2cf17ca72c575a4d21"
  - name: tx_count
    default: "200"
  - name: amount
    default: "1000"
steps:
  - id: create-network
    description: Private chain with the TVM flags seeded at genesis.
    command: network create
    args: ["--intent", "{{ params.lab_dir }}/network.yaml"]

  - id: await-chain
    kind: host
    description: Block until the node answers and is producing.
    env:
      NODE_URL: "{{ params.node_url }}"
    script: |
      until curl -sf -X POST "$NODE_URL/wallet/getnowblock" | grep -q '"number"'; do sleep 2; done

  - id: deploy
    kind: host
    description: Compile-free deploy of the prebuilt artifact; prints JSON.
    dir: "{{ params.lab_dir }}"
    run: ["node", "scripts/deploy.js"]
    env:
      TRON_HOST: "{{ params.node_url }}"
      TRON_PK: "{{ params.sender_key }}"

  - id: load
    kind: host
    description: TRC20 transfers through txgen against the deployed address.
    dir: "{{ params.lab_dir }}"
    env:
      NODE_URL: "{{ params.node_url }}"
      LAB_DIR: "{{ params.lab_dir }}"
      CONTRACT: "{{ steps.deploy.address_base58 }}"
      KEY: "{{ params.sender_key }}"
      COUNT: "{{ params.tx_count }}"
      AMOUNT: "{{ params.amount }}"
    script: |
      set -e
      sed -e "s|__NODE__|$NODE_URL|" -e "s|__LAB__|$LAB_DIR|" -e "s|__CONTRACT__|$CONTRACT|" \
          -e "s|__KEY__|$KEY|" -e "s|__COUNT__|$COUNT|" -e "s|__AMOUNT__|$AMOUNT|" \
          txgen-trc20.tmpl.json > txgen-trc20.json
      txgen generate  -c txgen-trc20.json
      txgen broadcast -c txgen-trc20.json

  - id: verify
    kind: host
    description: Assert receivers hold exactly tx_count * amount.
    dir: "{{ params.lab_dir }}"
    run: ["node", "scripts/expect.js",
          "scripts/verify-trc20.js",
          "{{ params.node_url }}",
          "{{ steps.deploy.address_hex }}",
          "{{ params.owner_hex }}",
          "{{ params.lab_dir }}/out/receivers.csv",
          "{{ params.tx_count }}", "{{ params.amount }}"]
